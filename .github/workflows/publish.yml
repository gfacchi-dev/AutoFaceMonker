name: Publish to PyPI

# Manual only. From 0.3.0 AutoFaceMonker depends on the gfacchi-dev/meshmonk
# fork through a git URL, and PyPI rejects packages with direct-reference
# dependencies, so tagging a release must not attempt an upload. Releases are
# published as GitHub tags/Releases; run this by hand only once meshmonk is
# resolvable from an index.
on:
  workflow_dispatch: {}

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
